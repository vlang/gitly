name: CI

on: [push, pull_request]

jobs:
  ubuntu-gcc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V
        uses: actions/checkout@v4
        with:
          repository: vlang/v
      - name: Checkout gitly
        uses: actions/checkout@v4
        with:
          path: gitly
      - name: Install Dependencies
        run: sudo apt install libsqlite3-dev
      - name: Build V
        run: |
          make
          sudo ./v symlink

      - name: Compile gitly
        run: |
          cd gitly
          v -cc gcc .

      - name: Compile gitly with -autofree
        run: |
          cd gitly
          v -cc gcc -autofree .

      - name: Compile gitly with -prod
        run: |
          cd gitly
          v -cc gcc -prod .

      - name: Compile CSS from SCSS files
        uses: gha-utilities/sass-build@v0.4.11
        with:
          source: gitly/static/css/gitly.scss
          destination: gitly/static/css/gitly.css

      - name: Run all tests
        run: |
          cd gitly
          v -cc gcc -d sqlite -d use_openssl test $(git ls-files '*_test.v')

      - name: Run tests/first_run.v
        run: |
          cd gitly
          v -cc gcc -g run tests/first_run.v

  macos-clang:
    runs-on: macos-latest
    steps:
      - name: Checkout V
        uses: actions/checkout@v4
        with:
          repository: vlang/v
      - name: Checkout gitly
        uses: actions/checkout@v4
        with:
          path: gitly
      - name: Build V
        run: |
          make
          ./v symlink
      - name: Compile gitly
        run: |
          cd gitly
          v -cc clang .
      - name: Compile gitly with -autofree
        run: |
          cd gitly
          v -cc clang -autofree .
      - name: Compile gitly with -prod
        run: |
          cd gitly
          v -cc clang -prod .
      - name: Compile CSS from SCSS files
        uses: gha-utilities/sass-build@v0.4.11
        with:
          source: gitly/static/css/gitly.scss
          destination: gitly/static/css/gitly.css
      - name: Run all tests
        run: |
          cd gitly
          v -cc clang -d sqlite -d use_openssl test $(git ls-files '*_test.v')
      - name: Run tests/first_run.v
        run: |
          cd gitly
          v -cc clang -g run tests/first_run.v

  windows-gcc:
    runs-on: windows-latest
    env:
      VFLAGS: -cc gcc
    steps:
      - name: Checkout V
        uses: actions/checkout@v4
        with:
          repository: vlang/v
      - name: Checkout gitly
        uses: actions/checkout@v4
        with:
          path: gitly
      - name: Build V
        run: |
          ./make.bat -gcc

      # Must come after "Build V": this used to run first, when neither `v`
      # nor `v.exe` existed, so the referenced script could not work at all.
      - name: Install SQLite
        run: .github\workflows\windows-install-sqlite.bat

      - name: Compile gitly
        run: |
          dir
          .\v.exe -cc gcc gitly

  ubuntu-tcc:
    runs-on: ubuntu-latest
    env:
      VFLAGS: -cc tcc -d no_backtrace -d no_segfault_handler
    steps:
      - name: Checkout V
        uses: actions/checkout@v4
        with:
          repository: vlang/v
      - name: Checkout gitly
        uses: actions/checkout@v4
        with:
          path: gitly
      - name: Install Dependencies
        run: sudo apt install libsqlite3-dev
      - name: Build V
        run: |
          echo $VFLAGS
          make
          sudo ./v symlink

      - name: Compile gitly with -autofree
        run: |
          cd gitly
          v -autofree .

      - name: Compile gitly
        run: |
          cd gitly
          v .

      - name: Compile CSS from SCSS files
        uses: gha-utilities/sass-build@v0.4.11
        with:
          source: gitly/static/css/gitly.scss
          destination: gitly/static/css/gitly.css

      - name: Run all tests
        run: |
          cd gitly
          v -d sqlite -d use_openssl test $(git ls-files '*_test.v')

      - name: Run tests/first_run.v
        run: |
          cd gitly
          v -g run tests/first_run.v
