name: CI

on: [push, pull_request]

jobs:
  ubuntu-gcc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V
        uses: actions/checkout@v4
        with:
          repository: vlang/v
      - name: Checkout gitly
        uses: actions/checkout@v4
        with:
          path: gitly
      - name: Install Dependencies
        run: sudo apt install libsqlite3-dev
      - name: Build V
        run: |
          make
          sudo ./v symlink

      - name: Compile gitly
        run: |
          cd gitly
          v -cc gcc .

      # Non-blocking: V's own vlib/net does not compile with -autofree, so
      # this step fails for reasons outside this repository. See vlang/v#30190.
      # Flip back to blocking once V's net module builds cleanly.
      - name: Compile gitly with -autofree (non-blocking, vlang/v#30190)
        continue-on-error: true
        run: |
          cd gitly
          v -cc gcc -autofree .

      - name: Compile gitly with -prod
        run: |
          cd gitly
          v -cc gcc -prod .

      - name: Compile CSS from SCSS files
        uses: gha-utilities/sass-build@v0.4.11
        with:
          source: gitly/static/css/gitly.scss
          destination: gitly/static/css/gitly.css

      - name: Run all tests
        run: |
          cd gitly
          v -cc gcc -d sqlite -d use_openssl test $(git ls-files '*_test.v')

      - name: Run tests/first_run.v
        run: |
          cd gitly
          v -cc gcc -g run tests/first_run.v

  macos-clang:
    runs-on: macos-latest
    steps:
      - name: Checkout V
        uses: actions/checkout@v4
        with:
          repository: vlang/v
      - name: Checkout gitly
        uses: actions/checkout@v4
        with:
          path: gitly
      - name: Build V
        run: |
          make
          ./v symlink
      - name: Compile gitly
        run: |
          cd gitly
          v -cc clang .
      # Non-blocking: vlib/net does not compile with -autofree; see vlang/v#30190.
      - name: Compile gitly with -autofree (non-blocking, vlang/v#30190)
        continue-on-error: true
        run: |
          cd gitly
          v -cc clang -autofree .
      - name: Compile gitly with -prod
        run: |
          cd gitly
          v -cc clang -prod .
      - name: Compile CSS from SCSS files
        uses: gha-utilities/sass-build@v0.4.11
        with:
          source: gitly/static/css/gitly.scss
          destination: gitly/static/css/gitly.css
      - name: Run all tests
        run: |
          cd gitly
          v -cc clang -d sqlite -d use_openssl test $(git ls-files '*_test.v')
      - name: Run tests/first_run.v
        run: |
          cd gitly
          v -cc clang -g run tests/first_run.v

  windows-gcc:
    runs-on: windows-latest
    env:
      VFLAGS: -cc gcc
    steps:
      - name: Checkout V
        uses: actions/checkout@v4
        with:
          repository: vlang/v
      - name: Checkout gitly
        uses: actions/checkout@v4
        with:
          path: gitly
      - name: Install SQLite
        run: |
          .github\workflows\windows-install-sqlite.bat
          dir thirdparty\sqlite\
      - name: Build V
        run: |
          ./make.bat -gcc
      - name: Compile gitly
        run: |
          dir
          .\v.exe -cc gcc gitly

  ubuntu-tcc:
    runs-on: ubuntu-latest
    env:
      VFLAGS: -cc tcc -d no_backtrace -d no_segfault_handler
    steps:
      - name: Checkout V
        uses: actions/checkout@v4
        with:
          repository: vlang/v
      - name: Checkout gitly
        uses: actions/checkout@v4
        with:
          path: gitly
      - name: Install Dependencies
        run: sudo apt install libsqlite3-dev
      - name: Build V
        run: |
          echo $VFLAGS
          make
          sudo ./v symlink

      # Non-blocking: vlib/net does not compile with -autofree; see vlang/v#30190.
      - name: Compile gitly with -autofree (non-blocking, vlang/v#30190)
        continue-on-error: true
        run: |
          cd gitly
          v -autofree .

      - name: Compile gitly
        run: |
          cd gitly
          v .

      - name: Compile CSS from SCSS files
        uses: gha-utilities/sass-build@v0.4.11
        with:
          source: gitly/static/css/gitly.scss
          destination: gitly/static/css/gitly.css

      - name: Run all tests
        run: |
          cd gitly
          v -d sqlite -d use_openssl test $(git ls-files '*_test.v')

      - name: Run tests/first_run.v
        run: |
          cd gitly
          v -g run tests/first_run.v
