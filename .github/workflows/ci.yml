name: CI

on: [push, pull_request]

jobs:
  ubuntu-gcc:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout V
        uses: actions/checkout@v4
        with:
          repository: vlang/v
      - name: Checkout gitly
        uses: actions/checkout@v4
        with:
          path: gitly
      - name: Install Dependencies
        run: sudo apt install libsqlite3-dev
      - name: Build V
        run: |
          make
          sudo ./v symlink

      - name: Compile gitly
        run: |
          cd gitly
          v -cc gcc .

      - name: Compile gitly with -autofree (non-blocking, vlang/v#30190)
        continue-on-error: true
        run: |
          cd gitly
          v -cc gcc -autofree .

      - name: Compile gitly with -prod
        run: |
          cd gitly
          v -cc gcc -prod .

      - name: Compile CSS from SCSS files
        uses: gha-utilities/sass-build@v0.4.11
        with:
          source: gitly/static/css/gitly.scss
          destination: gitly/static/css/gitly.css

      - name: Run all tests
        run: |
          cd gitly
          v -cc gcc -d sqlite -d use_openssl test $(git ls-files '*_test.v')

      - name: Run tests/first_run.v
        run: |
          cd gitly
          v -cc gcc -g run tests/first_run.v

  macos-clang:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout V
        uses: actions/checkout@v4
        with:
          repository: vlang/v
      - name: Checkout gitly
        uses: actions/checkout@v4
        with:
          path: gitly
      - name: Build V
        run: |
          make
          ./v symlink
      - name: Compile gitly
        run: |
          cd gitly
          v -cc clang .
      - name: Compile gitly with -autofree (non-blocking, vlang/v#30190)
        continue-on-error: true
        run: |
          cd gitly
          v -cc clang -autofree .
      - name: Compile gitly with -prod
        run: |
          cd gitly
          v -cc clang -prod .
      - name: Compile CSS from SCSS files
        uses: gha-utilities/sass-build@v0.4.11
        with:
          source: gitly/static/css/gitly.scss
          destination: gitly/static/css/gitly.css
      - name: Run all tests
        run: |
          cd gitly
          v -cc clang -d sqlite -d use_openssl test $(git ls-files '*_test.v')
      - name: Run tests/first_run.v
        run: |
          cd gitly
          v -cc clang -g run tests/first_run.v

  windows-gcc:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VFLAGS: -cc gcc
    steps:
      - name: Checkout V
        uses: actions/checkout@v4
        with:
          repository: vlang/v
      - name: Checkout gitly
        uses: actions/checkout@v4
        with:
          path: gitly
      - name: Build V
        shell: cmd
        run: |
          makev.bat -gcc
      # Must run after "Build V": the script shells out to `v.exe`, which
      # does not exist until V is built.
      - name: Install SQLite
        shell: cmd
        run: |
          gitly\.github\workflows\windows-install-sqlite.bat
      - name: Compile gitly
        run: |
          dir
          .\v.exe -cc gcc -d sqlite gitly

  ubuntu-tcc:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VFLAGS: -cc tcc -d no_backtrace -d no_segfault_handler
    steps:
      - name: Checkout V
        uses: actions/checkout@v4
        with:
          repository: vlang/v
      - name: Checkout gitly
        uses: actions/checkout@v4
        with:
          path: gitly
      - name: Install Dependencies
        run: sudo apt install libsqlite3-dev
      - name: Build V
        run: |
          echo $VFLAGS
          make
          sudo ./v symlink

      - name: Compile gitly with -autofree (non-blocking, vlang/v#30190)
        continue-on-error: true
        run: |
          cd gitly
          v -autofree .

      - name: Compile gitly
        run: |
          cd gitly
          v .

      - name: Compile CSS from SCSS files
        uses: gha-utilities/sass-build@v0.4.11
        with:
          source: gitly/static/css/gitly.scss
          destination: gitly/static/css/gitly.css

      - name: Run all tests
        run: |
          cd gitly
          v -d sqlite -d use_openssl test $(git ls-files '*_test.v')

      - name: Run tests/first_run.v
        run: |
          cd gitly
          v -g run tests/first_run.v
